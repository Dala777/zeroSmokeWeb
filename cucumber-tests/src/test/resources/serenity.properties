# Configuración del Proyecto
serenity.project.name=ZeroSmoke - Pruebas E2E
serenity.test.root=com.zerosmoke

# Configuración WebDriver
webdriver.driver=chrome
webdriver.timeouts.implicitlywait=10000
webdriver.wait.for.timeout=30000

# Opciones de Chrome
chrome.switches=--disable-extensions,--disable-dev-shm-usage,--no-sandbox,--disable-gpu,--window-size=1920,1080
headless.mode=false

# Screenshots
serenity.take.screenshots=FOR_FAILURES
serenity.screenshot.strategy=AFTER_EACH_STEP

# Reportes
serenity.reports.show.step.details=true
serenity.report.encoding=UTF8
serenity.logging=VERBOSE

# URLs de la aplicación
test.base.url=http://localhost:3000
api.base.url=http://localhost:5000/api

# Configuración de ambiente
environment=test
test.timeout=30
